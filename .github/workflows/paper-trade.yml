name: Daily paper trade

# Advances the breakout forward paper-trade once per trading day, commits the
# updated log back to the repo, and publishes both dashboards to GitHub Pages.
on:
  schedule:
    - cron: '30 22 * * 1-5'      # 22:30 UTC (~6:30pm ET), Mon-Fri (after the US close)
    - cron: '0 1 * * 2-6'        # 01:00 UTC backup (~9pm ET) if EOD data was late at 22:30
  workflow_dispatch: {}           # manual "Run workflow" button, for testing
  push:
    branches: [main]              # republish on every push to main (state commits use
                                  # GITHUB_TOKEN, which does not re-trigger -> no loop)

permissions:
  contents: write                 # commit the updated paper-trade state back
  pages: write                    # publish the dashboards
  id-token: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}   # trend data source (falls back to yfinance if unset)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # yfinance rate-limits cloud IPs intermittently; retry so a transient
      # failure never leaves a dashboard frozen on a prior day. Steps always
      # exit 0 -- if generation still fails, Pages just keeps the last-good copy.
      - name: Advance the paper account (breakout forward test)
        run: |
          ok=""
          for i in 1 2 3; do
            if python breakout_dashboard.py --capital 8800; then ok=1; break; fi
            echo "breakout attempt $i failed; retrying in 45s"; sleep 45
          done
          [ -n "$ok" ] || echo "breakout dashboard failed after 3 tries (keeping last-good)"

      - name: Rebuild the trend-sleeve dashboard
        run: |
          ok=""
          for i in 1 2 3; do
            if python dashboard.py --track 2026-07-28 --capital 13500; then ok=1; break; fi
            echo "trend attempt $i failed; retrying in 45s"; sleep 45
          done
          [ -n "$ok" ] || echo "trend dashboard failed after 3 tries (keeping last-good)"

      - name: Commit the forward-test log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/paper_breakout.json data/paper_trades.csv data/paper_equity.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No paper-state changes to commit."
          else
            git commit -m "Paper trade update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          for f in index.html dashboard.html breakout_dashboard.html; do
            [ -f "$f" ] && cp "$f" _site/
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
